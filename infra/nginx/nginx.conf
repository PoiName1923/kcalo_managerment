worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
env VERCEL_ORIGIN_HOST;
env LOGIN_PROXY_SECRET;
env VERCEL_PROTECTION_BYPASS;

events { worker_connections 1024; }

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $request_time';
    access_log /dev/stdout safe;
    lua_package_path '/etc/nginx/lua/?.lua;;';
    lua_shared_dict login_windows 10m;
    lua_shared_dict login_locks 1m;
    client_max_body_size 128k;
    server_tokens off;
    resolver 1.1.1.1 1.0.0.1 valid=60s ipv6=off;
    resolver_timeout 5s;

    init_by_lua_block {
        local host = os.getenv("VERCEL_ORIGIN_HOST") or ""
        assert(host:match("^[A-Za-z0-9%-]+%.vercel%.app$"), "VERCEL_ORIGIN_HOST must be a Vercel project hostname")
        local secret = os.getenv("LOGIN_PROXY_SECRET") or ""
        assert(#secret >= 32 and secret:match("^[A-Za-z0-9_%-]+$"), "Set a random LOGIN_PROXY_SECRET of at least 32 URL-safe characters")
    }

    server {
        listen 80;
        server_name _;
        return 308 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security 'max-age=31536000' always;

        location / {
            set_by_lua_block $vercel_host { return os.getenv("VERCEL_ORIGIN_HOST") }
            set_by_lua_block $vercel_bypass { return os.getenv("VERCEL_PROTECTION_BYPASS") or "" }
            access_by_lua_file /etc/nginx/lua/access.lua;
            proxy_pass https://$vercel_host;
            proxy_http_version 1.1;
            proxy_set_header Host $vercel_host;
            proxy_set_header Connection '';
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Vercel-Protection-Bypass $vercel_bypass;
            proxy_ssl_server_name on;
            proxy_ssl_name $vercel_host;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 4;
            proxy_read_timeout 310s;
            proxy_send_timeout 30s;
            proxy_redirect https://$vercel_host/ https://$host/;
        }
    }
}
