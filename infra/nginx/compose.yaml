services:
  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      VERCEL_ORIGIN_HOST: ${VERCEL_ORIGIN_HOST:?Set your-project.vercel.app hostname}
      LOGIN_PROXY_SECRET: ${LOGIN_PROXY_SECRET:?Set the same random secret as Vercel}
      VERCEL_PROTECTION_BYPASS: ${VERCEL_PROTECTION_BYPASS:-}
    volumes:
      - ./tls:/etc/nginx/tls:ro
